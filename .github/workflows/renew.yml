name: PidginHost Auto Renew

on:
  schedule:
    # 每 10 天运行一次 (UTC 00:00)，即每 30 天约 3 次
    - cron: '0 0 */10 * *'
  workflow_dispatch:   # 保留手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装 Python 依赖（含 SOCKS 支持）
        run: pip install requests[socks] pynacl

      - name: 🌐 设置sing-box代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }} # 在secret里设置 NODE_LINK 代理启用代理 
        run: |
          bash <(wget -qO- https://raw.githubusercontent.com/leung7963/other/main/proxy.sh)

      - name: 🚀 运行续期脚本（使用仓库中的 script.py）
        env:
          PIDGINHOST_API_TOKEN: ${{ secrets.PIDGINHOST_API_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PANEL_COOKIE: ${{ secrets.PANEL_COOKIE }}   # ✅ 关键修复：传递 Cookie
        run: python3 script.py

      # 已移除"最终通知"步骤，只保留脚本内部的续期结果通知

      - name: 删除旧的运行记录
        uses: leung7963/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}  # 自动匹配当前工作流
          use_daily_retention: "true"
          keep_minimum_runs: 1
          retain_days: 1
      - uses: leung7963/gh-workflow-keepalive@main